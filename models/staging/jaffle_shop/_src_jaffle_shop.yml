sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 1
          period: day
      loaded_at_field: _etl_loaded_at

    tables:
      - name: customers
        # Nesting under config correctly overrides the source-level config
        config:
          freshness: null  
      - name: orders

